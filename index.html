<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1226">
<title>Cube Jump</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0f1226; overflow: hidden;
    /* stop pinch/double-tap zoom, text selection, long-press menus and tap flashes */
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body { height: 100dvh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, system-ui, sans-serif; }
  canvas { display: block; }
  #controls {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    display: flex; gap: 8px;
  }
  #controls button {
    font: 600 13px -apple-system, system-ui, sans-serif;
    color: rgba(255,255,255,0.75); background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 999px;
    padding: 8px 14px; cursor: pointer;
  }
  #controls button.on { color: #4dff88; border-color: #4dff88; }
  #pauseBtn { min-width: 44px; }
  #pauseBtn[hidden] { display: none; }

  /* Menu / pause / crash screens: laid over the sky part of the game (positioned from JS) */
  .screen {
    position: fixed; display: none; box-sizing: border-box; padding: 0 16px;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    color: #fff; text-align: center;
  }
  .screen.show { display: flex; }
  .screen h1, .screen h2 { margin: 0; font-weight: 800; line-height: 1; letter-spacing: 2px; text-shadow: 0 4px 0 rgba(0,0,0,0.35); }
  .screen h1 { font-size: clamp(40px, 9vw, 76px); }
  .screen h2 { font-size: clamp(34px, 7vw, 56px); }
  .screen p { margin: 0; font-size: 18px; opacity: 0.9; }
  .screen .hint { font-size: 14px; opacity: 0.65; max-width: 520px; line-height: 1.5; }
  .screen .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .screen button { font-family: inherit; cursor: pointer; border-radius: 999px; }
  .screen .big {
    font-size: 22px; font-weight: 700; padding: 14px 40px; border: none;
    background: #ffd23f; color: #2a1d00; box-shadow: 0 6px 0 #b8860b;
  }
  .screen .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8860b; }
  .screen .ghost {
    font-size: 18px; font-weight: 600; padding: 12px 28px;
    background: rgba(0,0,0,0.35); color: #fff; border: 1px solid rgba(255,255,255,0.35);
  }
  .screen [hidden] { display: none; }

  /* Title screen */
  #titleScreen { padding-bottom: 26vh; } /* sit up in the sky, clear of the floor and the hopping cube */
  .screen h1.title { font-size: clamp(52px, 12vw, 104px); }
  .screen .play { font-size: 30px; padding: 18px 64px; }
  .screen .menu-head { position: relative; width: min(92vw, 780px); display: flex; justify-content: center; align-items: center; }
  .screen .menu-head h2 { font-size: clamp(26px, 5vw, 40px); }
  .screen .back { position: absolute; left: 0; font-size: 15px; padding: 8px 16px; }

  /* Level select */
  .screen .toggle {
    font-size: 15px; font-weight: 700; padding: 8px 18px;
    background: rgba(0,0,0,0.4); color: rgba(255,255,255,0.8); border: 2px solid rgba(255,255,255,0.25);
  }
  .screen .toggle.on { color: #4dff88; border-color: #4dff88; background: rgba(77,255,136,0.12); }
  .screen .level.disabled { opacity: 0.35; }
  #practiceBar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    display: flex; gap: 10px;
  }
  #practiceBar[hidden] { display: none; }
  #practiceBar button {
    font: 700 16px -apple-system, system-ui, sans-serif; cursor: pointer;
    padding: 12px 20px; border-radius: 999px; color: #fff;
    background: rgba(0,0,0,0.45); border: 2px solid rgba(255,255,255,0.3);
  }
  #practiceBar #cpAddBtn { color: #4dff88; border-color: #4dff88; }
  #practiceBar button:active { transform: translateY(2px); }
  #levelList { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; width: min(92vw, 780px); }
  .screen .level {
    display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; row-gap: 4px; align-items: center;
    padding: 12px 16px; border-radius: 14px; text-align: left; color: #fff;
    background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.18);
  }
  .screen .level:hover { border-color: rgba(255,255,255,0.5); }
  .screen .level:active { transform: translateY(2px); }
  .level .face { grid-row: 1 / span 2; width: 42px; height: 42px; display: block; }
  .level .lv-name { font-size: 17px; font-weight: 700; }
  .level .lv-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; opacity: 0.9; }
  .level .tag { padding: 2px 8px; border-radius: 999px; font-weight: 700; font-size: 12px; color: #111; white-space: nowrap; }
  .tag.easy { background: #4dff88; } .tag.normal { background: #ffd23f; }
  .tag.hard { background: #ff9a3c; } .tag.endless { background: #4dc3ff; }
  .tag.harder { background: #ff5c5c; } .tag.insane { background: #ff3df0; }
  .tag.easy-demon { background: #c9a3ff; } .tag.medium-demon { background: #a46bff; }
  .tag.hard-demon { background: #ff4d4d; color: #fff; } .tag.insane-demon { background: #ff2a8a; color: #fff; }
  .tag.extreme-demon { background: #2a0008; color: #ff5c5c; box-shadow: 0 0 0 1px #ff3b3b, 0 0 8px #ff3b3b; }
  .level.extreme { border-color: rgba(255,59,59,0.6); box-shadow: 0 0 14px rgba(255,59,59,0.35) inset; }
  .level.done { border-color: #4dff88; }

  /* narrow screens (portrait phones): smaller level cards */
  @media (max-width: 520px) {
    .screen h1 { font-size: 44px; }
    .screen .menu-head h2 { font-size: 22px; padding-left: 60px; }
    .screen .back { padding: 6px 12px; font-size: 13px; }
    .screen .level { padding: 8px 10px; column-gap: 8px; }
    .level .face { width: 32px; height: 32px; }
    .level .lv-name { font-size: 15px; }
    #levelList { gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  /* short screens (landscape phones): tighten the menu */
  @media (max-height: 460px) {
    .screen { gap: 10px; }
    .screen h1 { font-size: 36px; }
    .screen .hint { display: none; }
    .screen .level { padding: 8px 12px; gap: 4px; }
    .screen h1 { font-size: 30px; }
    .screen .toggle { padding: 4px 14px; font-size: 13px; }
    .screen .menu-head h2 { font-size: 22px; }
    .screen .back { padding: 4px 12px; font-size: 13px; }
    .screen h1.title { font-size: 56px; }
    .screen .level { padding: 5px 10px; row-gap: 2px; }
    .level .lv-name { font-size: 14px; }
    .level .lv-meta { font-size: 11px; }
    .level .face { width: 28px; height: 28px; }
    #levelList { gap: 6px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="titleScreen" class="screen">
  <h1 class="title">CUBE JUMP</h1>
  <button id="playBtn" class="big play" type="button" tabindex="-1">▶ PLAY</button>
  <p id="titleHint" class="hint"></p>
</div>

<div id="menuScreen" class="screen">
  <div class="menu-head">
    <button id="backBtn" class="ghost back" type="button" tabindex="-1">‹ Back</button>
    <h2>SELECT LEVEL</h2>
  </div>
  <button id="practiceToggle" class="toggle" type="button" tabindex="-1">Practice mode: Off</button>
  <div id="levelList"></div>
  <p id="menuHint" class="hint"></p>
</div>

<div id="completeScreen" class="screen">
  <h2>LEVEL COMPLETE!</h2>
  <p id="completeName"></p>
  <div class="row">
    <button id="nextBtn" class="big" type="button" tabindex="-1">Next level ▶</button>
    <button id="replayBtn" class="ghost" type="button" tabindex="-1">Replay</button>
    <button id="completeMenuBtn" class="ghost" type="button" tabindex="-1">Menu</button>
  </div>
</div>

<div id="pauseScreen" class="screen">
  <h2>PAUSED</h2>
  <div class="row">
    <button id="resumeBtn" class="big" type="button" tabindex="-1">▶ Resume</button>
    <button id="pauseMenuBtn" class="ghost" type="button" tabindex="-1">Menu</button>
  </div>
  <p id="pauseHint" class="hint"></p>
</div>

<div id="crashScreen" class="screen">
  <h2>CRASH!</h2>
  <p id="crashScore"></p>
  <div class="row">
    <button id="retryBtn" class="big" type="button" tabindex="-1">↻ Retry</button>
    <button id="crashMenuBtn" class="ghost" type="button" tabindex="-1">Menu</button>
  </div>
  <p id="crashHint" class="hint"></p>
</div>

<div id="practiceBar" hidden>
  <button id="cpAddBtn" type="button" tabindex="-1">◆ Checkpoint</button>
  <button id="cpRemoveBtn" type="button" tabindex="-1">✕ Undo</button>
</div>

<div id="controls">
  <button id="pauseBtn" type="button" tabindex="-1" hidden>❚❚</button>
  <button id="musicBtn" type="button" tabindex="-1">♪ Music</button>
  <button id="hitboxBtn" type="button" tabindex="-1">Hitboxes</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hitboxBtn = document.getElementById('hitboxBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const $ = id => document.getElementById(id);
  const screens = { title: $('titleScreen'), menu: $('menuScreen'), paused: $('pauseScreen'), dead: $('crashScreen'), complete: $('completeScreen') };
  const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

  $('titleHint').textContent = isTouch ? '' : 'Space or Enter to play';
  $('menuHint').textContent = isTouch
    ? 'Tap to jump, hold to keep jumping · each portal tells you what to do · practice mode lets you place checkpoints'
    : `Keys 1–9, 0, − pick a level, E for Endless, Esc goes back · Space, ↑ or click to jump · each portal tells you what to do · P pause · H hitboxes · in practice: C checkpoint, X undo`;
  $('pauseHint').textContent = isTouch ? '' : 'M or Esc for menu';
  $('crashHint').textContent = isTouch ? '' : 'M or Esc for menu';

  // ---- Tunables ----
  const CUBE = 40;               // cube size (outer hitbox: lands on / stands on blocks)
  const INNER = 12;              // inner hitbox inset per side -> 16x16 box; touching a spike or block with it = crash
  // Classic runner-cube jump: peaks just over 2 cube-heights (~84px) and lasts ~0.42s,
  // with a quick, snappy fall. The cube spins exactly 180° per jump.
  const GRAVITY = 3800;          // px/s^2
  const JUMP_V = -800;           // px/s (height = JUMP_V² / (2·GRAVITY) ≈ 84px)
  const AIR_TIME = 2 * -JUMP_V / GRAVITY; // ≈ 0.42s on flat ground
  // Ship mode (between a SHIP portal and a CUBE portal): hold to fly up, let go to sink.
  // It flies in a corridor between the floor and a ceiling CORRIDOR px above it, and can slide along both.
  const SHIP_GRAVITY = 1400;     // px/s^2 pulling down while not holding
  const SHIP_LIFT = 1400;        // px/s^2 pushing up while holding
  const SHIP_MAX = 420;          // top climb / sink speed, px/s
  const CORRIDOR = 320;          // floor-to-ceiling height in ship mode (8 cubes)
  // Ball mode (between a BALL portal and a CUBE portal): tap to flip gravity and roll along the
  // floor or the ceiling (same corridor as the ship). Hold to keep flipping each time it lands.
  const BALL_GRAVITY = 3000;     // px/s^2, pulling toward the floor or the ceiling
  const BALL_KICK = 300;         // px/s push toward the new side when gravity flips
  const BALL_MAX = 900;          // fastest fall, px/s
  // Wave mode (between a WAVE portal and a CUBE portal): hold to fly diagonally up, let go to dive
  // diagonally down (45°, so it climbs exactly as fast as the level scrolls). Only the inner box counts.
  // UFO (o portal): every tap is a flap (holding doesn't keep flapping); gravity pulls it back down.
  const UFO_GRAVITY = 2800;      // px/s^2
  const UFO_JUMP = -560;         // px/s, a flap's upward speed (about 56px high)
  const UFO_MAX = 700;           // fastest fall / climb, px/s
  // Spider (p portal): tap while on a surface to teleport straight across to the floor or ceiling.
  const SPIDER_MAX = 900;        // fastest fall after walking off an edge, px/s
  // Swing (g portal): every tap flips which way you're pulled, even in mid-air.
  const SWING_G = 2200;          // px/s^2
  const SWING_MAX = 520;         // px/s
  const SLOPE_SPIKE_HB = 16;     // the spikes lining a wave tunnel's floor, ceiling and slopes reach this far out (as drawn)
  const WAVE_HB = 6;             // the wave's box for ground spikes: inset this much per side (28x28, about the dart's size)
  const WAVE_SAFE = 3;           // columns of plain floor after a WAVE portal before the floor spikes start
  const SLAB_H = 20;             // floating slab thickness
  const SLAB_LOW = 70;           // height of a low slab's top above the floor (a cube fits underneath)
  const SLAB_HIGH = 140;         // height of a high slab's top
  const THORN_H = 18;            // ground spikes lining the floor of every ship section: drawn height
  const THORN_HB = 18;           // ...and hitbox height: the full drawn height (touching it with your body = crash)
  const THORN_GAP = 120;         // they start this far past the SHIP portal
  const START_SPEED = 360;       // px/s
  const MAX_SPEED = 720;
  const SPEED_GAIN = 8;          // px/s gained per second

  // ---- Screen fitting ----
  // The game world is at least 640 wide and 540 tall (in game units). It stretches to match the
  // screen's shape: wider on landscape phones, taller on portrait phones, so it fills the screen.
  let W = 960, H = 540, GROUND_Y = 420, viewScale = 1, dpr = 1;

  function resize() {
    const cssW = window.innerWidth, cssH = window.innerHeight;
    if (!cssW || !cssH) return; // hidden / not laid out yet (0x0): keep the last good size
    const aspect = cssW / cssH;
    W = Math.min(1280, Math.max(640, 540 * aspect));
    H = Math.max(540, W / aspect);
    viewScale = Math.min(cssW / W, cssH / H);
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = W * viewScale + 'px';
    canvas.style.height = H * viewScale + 'px';
    canvas.width = Math.round(W * viewScale * dpr);
    canvas.height = Math.round(H * viewScale * dpr);

    // floor sits 120 from the bottom on landscape; on tall screens it sits ~62% down
    const newGround = Math.round(Math.min(H - 120, Math.max(420, H * 0.62)));
    const dy = newGround - GROUND_Y;
    GROUND_Y = newGround;
    if (player) {
      player.y += dy;
      for (const o of obstacles) o.y += dy;
      for (const p of particles) p.y += dy;
    }

    // lay the menu/pause/crash screens over the sky (everything above the floor)
    const r = canvas.getBoundingClientRect();
    for (const el of Object.values(screens)) {
      el.style.left = r.left + 'px';
      el.style.top = r.top + 'px';
      el.style.width = r.width + 'px';
      // the menu can use the whole screen (there's no gameplay on the floor); the others sit over the sky
      el.style.height = (el === screens.menu || el === screens.title ? r.height : GROUND_Y * viewScale) + 'px';
    }
  }

  // ---- State ----
  let state = 'title';           // title | menu (level select) | playing | paused | dead | complete
  let player, obstacles, particles, speed, distance, spawnIn, best, shake, groundOffset, holdJump;
  let mode = null;               // the level being played, or null for Endless
  let tapQueued = false;         // set by each new press, used up by the next physics step
  let rings = [], clock = 0, menuT = 0, trailTick = 0, speedFlash = null;   // visual effects only
  const hexToRgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(',');
  // Practice mode: crash and you respawn at your last checkpoint; nothing is saved
  let practice = false;          // the menu toggle
  let inPractice = false;        // is the current run a practice run?
  let checkpoints = [], attempt = 1, respawnT = 0;
  let finishX = 0, levelLength = 1;
  best = Number(localStorageGet('cubeJumpBest') || 0);   // Endless best score

  function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
  const levelBest = lv => Number(localStorageGet('cubeJumpLevel:' + lv.id) || 0);   // best % per level
  const progress = () => Math.max(0, Math.min(100, Math.floor(distance / levelLength * 100)));

  // ---- Levels ----
  // Each character in a map is one 40px column:
  //   .  empty      ^  spike      1 2 3  block 1, 2 or 3 cubes tall
  //   A  1-tall block with a spike on top      B  2-tall block with a spike on top
  //   floating slabs (run under them or jump onto them):
  //   _  low slab (top 70 up)    +  low slab with a spike on the ground under it    =  high slab (top 140 up)
  //   speed portals:  s = 0.5x   n = 1x   f = 2x   v = 3x   x = 4x
  //   mode portals:   [ = SHIP (hold to fly)   ( = BALL (tap to flip gravity)   ] = back to CUBE
  //   w = WAVE portal (hold to rise, let go to dive; exit with ])
  //   o = UFO portal (tap to flap)   p = SPIDER portal (tap to teleport)   g = SWING portal (tap to flip)
  //   slopes (inside a wave section): in `map`, / = floor rises 1 cube over this column, \ = floor drops 1 cube (typed \\ in the string);
  //   in `ceil`, \ = ceiling comes down 1 cube, / = ceiling goes back up. A wave tunnel's floor, ceiling and
  //   slopes are all lined with spikes; the first few columns of plain floor after the portal are safe.
  //   gravity portals: u = yellow, upside down (falls toward the ceiling)   d = blue, normal gravity
  //   (a u ... d stretch outside a ship/ball section gets a ceiling to run along; going through a
  //    SHIP, BALL or CUBE portal always sets gravity back to normal)
  // A level can also have a `ceil` string, lined up with `map`, for things hanging from the ship
  // corridor's ceiling (ship and ball sections): 1 2 3 = hanging block, ^ = spike pointing down, A B = hanging block with a spike under it.
  // Every level has been checked with a solver to make sure it can be beaten.
  // Speed portals set an exact speed (px/s). Like the genre's portals the names aren't literal
  // multiples: 4x is about 1.85 times normal, so you can still see what's coming.
  // SPEED-TIERS-START
  const SPEED_TIERS = { s: 274, n: 340, f: 423, v: 512, x: 630 };
  // SPEED-TIERS-END
  const PORTAL_STYLE = {
    s: { label: '0.5x', color: '#ffa53c', arrows: 1, back: true },
    n: { label: '1x', color: '#4dc3ff', arrows: 1 },
    f: { label: '2x', color: '#4dff88', arrows: 2 },
    v: { label: '3x', color: '#ff3df0', arrows: 3 },
    x: { label: '4x', color: '#ff4040', arrows: 4 },
    '[': { label: 'SHIP', color: '#ffd23f', arrows: 0, ship: true },
    '(': { label: 'BALL', color: '#ff5c5c', arrows: 0, ball: true },
    ']': { label: 'CUBE', color: '#4dff88', arrows: 0 },
    w: { label: 'WAVE', color: '#4dc3ff', arrows: 0, wave: true },
    o: { label: 'UFO', color: '#c9a3ff', arrows: 0, ufo: true },
    p: { label: 'SPIDER', color: '#ff3df0', arrows: 0, spider: true },
    g: { label: 'SWING', color: '#ffa53c', arrows: 0, swing: true },
    u: { label: '', color: '#ffd23f', arrows: 0, grav: -1 },
    d: { label: '', color: '#4dc3ff', arrows: 0, grav: 1 },
  };
  // LEVELS-START
  const LEVELS = [
    {
      id: 'first-steps', name: 'First Steps', difficulty: 'Easy', speed: 340, hue: 150,
      map: '..........^.......^...u...................................d...o....1........3........2........1.....]..............^^.......1.......1...__+++__......^......__+++__......^......11...p....^^^...............2............]........^^...[......2..........22..........^^^^.........]...1...1..f...^...^......111......^^...(.....^^^.......................22.................]...g....^^^...................22...............]..........1......^^^..n...11.1...w.........//..\\\\..//..\\\\.........].......^.^........',
      ceil: '..............................^.......^^.......1......^............3........1........2........3....................................................................................................^^^.............2..............................2...........22..........2..................................................................^^^......................22.........................^^^..................22............................................\\\\\\..//..\\\\..//..\\\\....///',
    },
    {
      id: 'block-party', name: 'Block Party', difficulty: 'Normal', speed: 380, hue: 270,
      map: '..........^.....11.....^^.....1.2...u...................................d...o....1........3........2........1.....].............^.....A......12..f..^^^...__+++__......^......__+++__...p....^^^...............2............]........1122..n...^.....A...[......2..........22..........^^^^.........]...2..2......^^....^^......112...(.....^^^.......................22.................]...w.........//..\\\\..//..\\\\.........]...g....^^^...................22...............]...........1A.....^^^..s..12.21..n...^.^.^........',
      ceil: '............................................^.......^^.......1......^............3........1........2........3.........................................................................................^^^.............2.............................................2...........22..........2............................................................^^^......................22..............\\\\\\..//..\\\\..//..\\\\....///......................^^^..................22',
    },
    {
      id: 'speed-shift', name: 'Speed Shift', difficulty: 'Normal', speed: 340, hue: 200,
      map: '..........^......^^......1.2...u...................................d...o....1........3........2........1.....].............f......^.......^^.......1.2...__+++__......^......__+++__.......v.......^........^^...p....^^^...............2............]..........1..2...[......2..........22..........^^^^.........].....x........^..........^^.........1...2...(.....^^^.......................22.................]...g....^^^...................22...............].............s....^...^^...1.2...A...n...w.........//..\\\\..//..\\\\.........].......^......^^......12........',
      ceil: '.......................................^.......^^.......1......^............3........1........2........3.......................................................................................................................^^^.............2..................................2...........22..........2.......................................................................^^^......................22.........................^^^..................22....................................................\\\\\\..//..\\\\..//..\\\\....///',
    },
    {

    }
    function pause() { if (ac && song) { paused = true; ac.suspend(); } }
    function resume() { if (ac && paused) { paused = false; ac.resume(); } }

    function crash() {

      const t = ac.currentTime;
      hit(t, 0.45, 0.5, 'lowpass', 1500, master);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square';

      o.frequency.exponentialRampToValueAtTime(55, t + 0.3);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);

      if (!ensure()) return;

    function beat() {

      let lastKick = -1;
      for (const k of kickTimes) if (k <= now && k > lastKick) lastKick = k;

  function buildLevel(lv) {
    const startX = player.x + RUNWAY;
    let shipFrom = null, shipKind = '', gravFrom = null, waveF = 0, waveC = 0;
    [...lv.map].forEach((c, i) => {
      const x = startX + i * 40;
      const blockH = { '1': 40, '2': 80, '3': 120, A: 40, B: 80 }[c];
      if (blockH) obstacles.push({ t: 'b', x, w: 40, h: blockH, y: GROUND_Y - blockH });
      const slabTop = { _: SLAB_LOW, '+': SLAB_LOW, '=': SLAB_HIGH }[c];
      if (slabTop) obstacles.push({ t: 'b', slab: true, x, w: 40, h: SLAB_H, y: GROUND_Y - slabTop });
      if (c === '+') obstacles.push({ t: 's', x, w: 40, h: 40, y: GROUND_Y - 40 });
      if (c === '^') obstacles.push({ t: 's', x, w: 40, h: 40, y: GROUND_Y - 40 });
      if (c === 'A' || c === 'B') obstacles.push({ t: 's', x, w: 40, h: 40, y: GROUND_Y - blockH - 40 });
      if (SPEED_TIERS[c]) obstacles.push({ t: 'p', tier: c, x, w: 40, h: 120, y: GROUND_Y - 120, used: false });
      if (c === 'u') obstacles.push({ t: 'p', tier: c, x, w: 40, h: 140, y: GROUND_Y - 140, used: false });
      if (c === 'd') obstacles.push({ t: 'p', tier: c, x, w: 40, h: 140, y: GROUND_Y - CORRIDOR, used: false });
      // an upside-down stretch outside a ship/ball section gets its own ceiling
      if (c === 'u' && shipFrom === null && gravFrom === null) gravFrom = x;
      if (c === 'd' && gravFrom !== null) { obstacles.push({ t: 'c', x: gravFrom, w: x + 40 - gravFrom, y: GROUND_Y - CORRIDOR - 40, h: 40 }); gravFrom = null; }
      if ('[(wopg]'.includes(c)) obstacles.push({ t: 'p', tier: c, x, w: 40, h: 200, y: GROUND_Y - 200, used: false });
      // the ceiling slab above each ship, ball or wave section
      if ('[(wopg'.includes(c)) { shipFrom = x; shipKind = c; }
      // a wave section's floor and ceiling: one sloped or flat piece per column (heights in px)
      if (shipKind === 'w' && shipFrom !== null) {
        const cc = (lv.ceil || '')[i], k = (x - shipFrom) / 40;
        const f0 = waveF, c0 = waveC;
        if (c === '/') waveF += 40; else if (c === '\\') waveF -= 40;
        if (cc === '\\') waveC += 40; else if (cc === '/') waveC -= 40;
        obstacles.push({ t: 'tf', x, w: 40, h0: f0, h1: waveF, safe: k < WAVE_SAFE || c === ']' });
        obstacles.push({ t: 'tc', x, w: 40, h0: c0, h1: waveC, safe: c === ']' });
      }
      // ...and, for the ship, a strip of ground spikes along the floor (it starts 3 columns in, so there's time to take off)
      if (c === ']' && shipFrom !== null) {
        obstacles.push({ t: 'c', x: shipFrom, w: x + 40 - shipFrom, y: GROUND_Y - CORRIDOR - 40, h: 40 });
        waveF = waveC = 0;
        if (shipKind === '[') obstacles.push({ t: 'g', x: shipFrom + THORN_GAP, w: x + 40 - shipFrom - THORN_GAP, y: GROUND_Y - THORN_H, h: THORN_H });
        shipFrom = null;
      }
    });
    const ceilY = GROUND_Y - CORRIDOR;
    [...(lv.ceil || '')].forEach((c, i) => {
      const x = startX + i * 40;
      const blockH = { '1': 40, '2': 80, '3': 120, A: 40, B: 80 }[c];
      if (blockH) obstacles.push({ t: 'b', hang: true, x, w: 40, h: blockH, y: ceilY });
      if (c === '^') obstacles.push({ t: 's', flip: true, x, w: 40, h: 40, y: ceilY });
      if (c === 'A' || c === 'B') obstacles.push({ t: 's', flip: true, x, w: 40, h: 40, y: ceilY + blockH });
    });
    finishX = startX + (lv.map.length + 4) * 40;
    levelLength = finishX - player.x;
  }

  function reset() {

  const patterns = [

  function spawn() {

    for (const o of p) {

        obstacles.push({ t: 's', x: baseX + o.x, w: 40, h: 40, y: GROUND_Y - 40 - (o.y || 0) });

        width = Math.max(width, o.x + o.w);

  }

  // ---- Practice checkpoints ----
  function placeCheckpoint() {
    if (!inPractice || state !== 'playing') return;

  }
  function removeCheckpoint() {
    if (inPractice && (state === 'playing' || state === 'respawn')) checkpoints.pop();
  }
  // put the world and the cube back exactly as they were at the last checkpoint (or the start)
  function respawn() {
    attempt++;
    const cp = checkpoints[checkpoints.length - 1];
    reset();
    if (cp) {
      distance = cp.dist;
      groundOffset = cp.dist % 40;
      for (const o of obstacles) o.x -= cp.dist;
      obstacles = obstacles.filter(o => o.x + o.w > -50);
      finishX -= cp.dist;
      speed = cp.speed;
      for (const o of obstacles) if (o.t === 'p' && o.x + o.w / 2 <= player.x + CUBE / 2) o.used = true;
      Object.assign(player, { y: cp.y, vy: cp.vy, onGround: cp.onGround, rot: cp.rot, ship: cp.ship, ball: cp.ball, wave: cp.wave, ufo: cp.ufo, spider: cp.spider, swing: cp.swing, grav: cp.grav });

  // Jump input. On the main menu only a level button (or Space/Enter/1–4) starts the game.
  function press(fromPointer) {

    $('practiceBar').hidden = !(inPractice && (state === 'playing' || state === 'respawn'));
    pauseBtn.hidden = state !== 'playing' && state !== 'paused';
    pauseBtn.textContent = state === 'paused' ? '▶' : '❚❚' + (isTouch ? '' : ' (P)');
    pauseBtn.setAttribute('aria-label', state === 'paused' ? 'Resume' : 'Pause');
    pauseBtn.classList.toggle('on', state === 'paused');
  }

  // Mouse, finger or pen anywhere else on the screen jumps
  window.addEventListener('pointerdown', e => { if (e.button === 0 || e.pointerType !== 'mouse') press(true); });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  // Block iOS Safari's double-tap zoom, scrolling and long-press callouts
  document.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
  // If you switch tabs/apps mid-run, pause so you don't come back to a crash
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { release(); if (state === 'playing') { state = 'paused'; music.pause(); } }
  });

  // ---- Physics helpers ----
  // Spike hitbox: a small rectangle in the middle of the 40x40 spike
  const SPIKE_HB_W = 12;         // width, centred horizontally
  const SPIKE_HB_H = 20;         // height
  const SPIKE_HB_TOP = 14;       // gap from the spike's tip down to the top of the hitbox
  function spikeBox(s) {
    // a ceiling spike points down, so its hitbox is measured up from its tip
    return { x: s.x + (s.w - SPIKE_HB_W) / 2, y: s.flip ? s.y + s.h - SPIKE_HB_TOP - SPIKE_HB_H : s.y + SPIKE_HB_TOP, w: SPIKE_HB_W, h: SPIKE_HB_H };
  }
  function thornBox(o) { return { x: o.x, y: o.y + o.h - THORN_HB, w: o.w, h: THORN_HB }; }
  // wave tunnel pieces: the box is hit if it comes within SLOPE_SPIKE_HB of the (sloped) surface
  function terrainHit(b, o) {
    const xs = Math.max(b.x, o.x), xe = Math.min(b.x + b.w, o.x + o.w);
    if (xs >= xe) return false;
    const at = x => o.h0 + (o.h1 - o.h0) * (x - o.x) / o.w, hmax = Math.max(at(xs), at(xe));
    if (o.safe && hmax === 0) return false;
    return o.t === 'tf' ? b.y + b.h > GROUND_Y - hmax - SLOPE_SPIKE_HB
                        : b.y < GROUND_Y - CORRIDOR + hmax + SLOPE_SPIKE_HB;
  }
  // ground spikes (ship floors, wave tunnels) kill as soon as they touch what you see: the whole
  // 40x40 box, or for the smaller wave dart a 28x28 box
  function spikeTouchBox() {
    const i = player.wave ? WAVE_HB : 0;
    return { x: player.x + i, y: player.y + i, w: CUBE - 2 * i, h: CUBE - 2 * i };
  }
  const inCorridor = () => player.ship || player.ball || player.wave || player.ufo || player.spider || player.swing;
  // spider: jump straight to the nearest surface on the other side (ceiling / block underside, or floor / block top)
  function spiderTeleport() {
    const x0 = player.x, x1 = player.x + CUBE, from = player.y;
    const over = o => o.t === 'b' && o.x < x1 && o.x + o.w > x0;
    let y;
    if (player.grav > 0) {
      y = GROUND_Y - CORRIDOR;
      for (const o of obstacles) if (over(o) && o.y + o.h <= player.y + 0.5) y = Math.max(y, o.y + o.h);
    } else {
      y = GROUND_Y - CUBE;
      for (const o of obstacles) if (over(o) && o.y >= player.y + CUBE - 0.5) y = Math.min(y, o.y - CUBE);
    }
    player.y = y; player.vy = 0; player.grav = -player.grav; player.onGround = false;
    // a streak where it jumped
    for (let i = 0; i < 14; i++) particles.push({ x: player.x + 8 + Math.random() * 24, y: from + (y - from) * Math.random() + CUBE / 2, vx: -speed * 0.3, vy: 0, life: 0.35, size: 3 + Math.random() * 3, g: 0, glow: true, color: '#ff3df0' });
  }
  function outerBox() { return { x: player.x, y: player.y, w: CUBE, h: CUBE }; }
  function innerBox() { return { x: player.x + INNER, y: player.y + INNER, w: CUBE - 2 * INNER, h: CUBE - 2 * INNER }; }
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function die() {
    state = inPractice ? 'respawn' : 'dead';
    shake = 14;
    if (inPractice) respawnT = 0.6; else music.stop(); // in practice the music keeps going
    music.crash();
    if (navigator.vibrate) navigator.vibrate(80);
    const cx = player.x + CUBE / 2, cy = player.y + CUBE / 2;
    rings.push({ x: cx, y: cy, r: 8, v: 520, life: 1, color: '255,190,60' });
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, v = 150 + Math.random() * 420;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 200, life: 1, size: 4 + Math.random() * 7, glow: true, color: ['#ffd23f', '#ff9a1f', '#fff3b0'][i % 3] });
    }
    if (inPractice) return; // practice runs don't count toward your best
    if (mode) {
      if (progress() > levelBest(mode)) localStorageSet('cubeJumpLevel:' + mode.id, progress());
    } else {
      const score = Math.floor(distance / 10);
      if (score > best) { best = score; localStorageSet('cubeJumpBest', best); }
    }
  }

  // ---- Update ----
  function update(dt) {
    if (state === 'paused') return; // freeze everything, including particles
    clock += dt;
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += GRAVITY * (p.g ?? 0.5) * dt; p.life -= dt * 1.2; }
    particles = particles.filter(p => p.life > 0);
    for (const r of rings) { r.r += r.v * dt; r.life -= dt * 2.2; }
    if (speedFlash && (speedFlash.life -= dt * 1.2) <= 0) speedFlash = null;
    rings = rings.filter(r => r.life > 0);
    if (shake > 0) shake = Math.max(0, shake - 60 * dt);
    player.squash *= Math.exp(-dt * 12);

    // main menu: scroll the scenery slowly and let the cube hop along behind the menu
    if (state === 'menu' || state === 'title') {
      distance += 120 * dt;
      groundOffset = (groundOffset + 120 * dt) % 40;
      menuT += dt;
      const period = 1.1, ph = menuT % period;
      if (ph < AIR_TIME) {
        const u = ph / AIR_TIME;
        player.y = GROUND_Y - CUBE - (JUMP_V * JUMP_V / (2 * GRAVITY)) * 4 * u * (1 - u);
        player.rot = (Math.floor(menuT / period) + u) * Math.PI;
      } else {
        if (ph - dt < AIR_TIME) player.squash = 0.9;
        player.y = GROUND_Y - CUBE;
      }
      return;
    }

    if (state === 'respawn') { respawnT -= dt; if (respawnT <= 0) respawn(); return; }
    if (state !== 'playing') return;

    if (!mode) speed = Math.min(MAX_SPEED, speed + SPEED_GAIN * dt); // levels keep a fixed speed
    const dx = speed * dt;
    distance += dx;
    groundOffset = (groundOffset + dx) % 40;

    // move obstacles (and the cube's ghost trail, which lives in world space)
    for (const o of obstacles) o.x -= dx;
    for (const g of player.trail) g.x -= dx;
    for (const g of player.waveTrail) g.x -= dx;
    player.waveTrail = player.waveTrail.filter(g => g.x > -40);
    obstacles = obstacles.filter(o => o.x + o.w > -50);
    // speed portals: switch speed when the cube's centre passes the portal's centre
    for (const o of obstacles) {
      if (o.t !== 'p' || o.used || o.x + o.w / 2 > player.x + CUBE / 2) continue;
      o.used = true;
      const st = PORTAL_STYLE[o.tier];
      if (SPEED_TIERS[o.tier]) {
        speed = SPEED_TIERS[o.tier];
        speedFlash = { text: st.label + ' SPEED', color: st.color, life: 1 };
      } else if (st.grav) {
        if (player.grav !== st.grav) { player.grav = st.grav; player.onGround = false; }
        speedFlash = { text: st.grav < 0 ? 'GRAVITY FLIPPED' : 'GRAVITY NORMAL', color: st.color, life: 1 };
      } else {
        player.ship = !!st.ship; player.ball = !!st.ball; player.wave = !!st.wave;
        player.ufo = !!st.ufo; player.spider = !!st.spider; player.swing = !!st.swing; player.grav = 1;
        player.waveTrail = [];
        if (player.ship) player.vy = Math.max(-SHIP_MAX, Math.min(SHIP_MAX, player.vy));
        speedFlash = { text: st.ship ? 'SHIP — HOLD TO FLY' : st.ball ? 'BALL — TAP TO FLIP' : st.wave ? 'WAVE — HOLD TO RISE' : st.ufo ? 'UFO — TAP TO FLAP' : st.spider ? 'SPIDER — TAP TO TELEPORT' : st.swing ? 'SWING — TAP TO FLIP' : 'CUBE', color: st.color, life: 1 };
      }
      rings.push({ x: o.x + o.w / 2, y: o.y + o.h / 2, r: 10, v: 420, life: 0.9, color: hexToRgb(st.color) });
    }
    if (mode) {
      finishX -= dx;
      if (finishX <= player.x) return completeLevel();
    } else {
      spawnIn -= dx;
      if (spawnIn <= 0) spawn();
    }

    const wasOnGround = player.onGround;
    const tap = tapQueued; tapQueued = false;
    if (player.ufo) {
      // UFO: a tap is a flap
      if (tap) { player.vy = UFO_JUMP * player.grav; player.squash = -0.5; }
      player.vy = Math.max(-UFO_MAX, Math.min(UFO_MAX, player.vy + UFO_GRAVITY * player.grav * dt));
    } else if (player.swing) {
      // swing: a tap flips the pull
      if (tap) player.grav = -player.grav;
      player.vy = Math.max(-SWING_MAX, Math.min(SWING_MAX, player.vy + SWING_G * player.grav * dt));
    } else if (player.spider) {
      // spider: tap on a surface to teleport straight across
      if (tap && player.onGround) spiderTeleport();
      player.vy = Math.max(-SPIDER_MAX, Math.min(SPIDER_MAX, player.vy + GRAVITY * player.grav * dt));
    } else if (player.ship) {
      // ship: hold to climb, let go to sink, with a speed limit both ways (both flip when upside down)
      player.vy += (holdJump ? -SHIP_LIFT : SHIP_GRAVITY) * player.grav * dt;
      player.vy = Math.max(-SHIP_MAX, Math.min(SHIP_MAX, player.vy));
    } else if (player.wave) {
      // wave: straight diagonal lines, up while holding and down while not (flipped when upside down)
      player.vy = (holdJump ? -1 : 1) * speed * player.grav;
    } else if (player.ball) {
      // ball: tap while touching a surface to flip gravity
      if (holdJump && player.onGround) { player.grav = -player.grav; player.vy = player.grav * BALL_KICK; player.onGround = false; player.squash = -0.5; }
      player.vy = Math.max(-BALL_MAX, Math.min(BALL_MAX, player.vy + BALL_GRAVITY * player.grav * dt));
    } else {
      // jump (hold to keep bouncing)
      // (upside down, the cube falls toward the ceiling and jumps down)
      if (holdJump && player.onGround) { player.vy = JUMP_V * player.grav; player.onGround = false; player.squash = -0.7; }
      player.vy += GRAVITY * player.grav * dt;
    }

    // vertical movement
    player.y += player.vy * dt;
    player.onGround = false;

    // floor, and the corridor's ceiling (ship, ball, or anything upside down): both can be slid along.
    // Upside down, you only count as "on a surface" on the ceiling or under a block.
    if (player.y + CUBE >= GROUND_Y) { player.y = GROUND_Y - CUBE; player.vy = 0; player.onGround = player.grav > 0; }
    if ((inCorridor() || player.grav < 0) && player.y <= GROUND_Y - CORRIDOR) {
      player.y = GROUND_Y - CORRIDOR; player.vy = Math.max(0, player.vy);
      if (player.grav < 0) player.onGround = true;
    }

    // blocks: the OUTER box lands on top; the INNER box touching a block = crash.
    // If the outer box sinks into a block's top by no more than INNER px while falling,
    // it snaps up and lands (the inner box hasn't touched the block yet).
    for (const o of obstacles) {
      if (o.t !== 'b' || !rectsOverlap(outerBox(), o)) continue;
      if (player.wave) { if (rectsOverlap(innerBox(), o)) return die(); continue; } // the wave can't land on anything
      if (player.vy >= 0 && player.y + CUBE - o.y <= INNER) {
        player.y = o.y - CUBE; player.vy = 0; player.onGround = player.grav > 0;
      } else if ((inCorridor() || player.grav < 0) && player.vy <= 0 && o.y + o.h - player.y <= INNER) {
        player.y = o.y + o.h; player.vy = 0; // vehicles and an upside-down cube can slide along a block's underside
        if (player.grav < 0) player.onGround = true;
      } else if (rectsOverlap(innerBox(), o)) {
        return die();
      }
    }

    // spikes: only the INNER box can be hit
    const inner = innerBox();
    for (const o of obstacles) {
      if (o.t === 's' && rectsOverlap(inner, spikeBox(o))) return die();
      if (o.t === 'g' && rectsOverlap(spikeTouchBox(), thornBox(o))) return die();
      if ((o.t === 'tf' || o.t === 'tc') && terrainHit(spikeTouchBox(), o)) return die();
    }

    // landing: squash and kick up a little dust
    if (!wasOnGround && player.onGround && player.grav > 0) {
      player.squash = 0.9;
      for (let i = 0; i < 8; i++) {
        particles.push({ x: player.x + Math.random() * CUBE, y: player.y + CUBE, vx: -60 - Math.random() * 140, vy: -40 - Math.random() * 90, life: 0.5, size: 3 + Math.random() * 3, g: 0.15, color: 'rgba(255,255,255,0.7)' });
      }
    }

    // ghost trail
    trailTick += dt;
    if (trailTick >= 1 / 40) {
      trailTick = 0;
      player.trail.push({ x: player.x, y: player.y, rot: player.rot });
      if (player.trail.length > 6) player.trail.shift();
    }

    // rotation: spin in air, snap to nearest 90° on ground
    if (player.ufo || player.spider) {
      player.rot = 0;
    } else if (player.swing) {
      player.rot += (Math.atan2(player.vy, speed) * 0.6 - player.rot) * Math.min(1, dt * 12);
      if (Math.random() < 0.5) particles.push({ x: player.x + CUBE / 2, y: player.y + (player.grav > 0 ? 2 : CUBE - 2), vx: -speed * 0.4, vy: -player.grav * 120, life: 0.35, size: 3 + Math.random() * 3, g: 0, glow: true, color: ['#ffa53c', '#ffd23f'][Math.floor(Math.random() * 2)] });
    } else if (player.wave) {
      player.rot = Math.atan2(player.vy, speed);
      player.waveTrail.push({ x: player.x + CUBE / 2, y: player.y + CUBE / 2 });
      if (player.waveTrail.length > 400) player.waveTrail.shift();
    } else if (player.ship) {
      // the ship tilts toward where it's heading; a flame trails behind it
      const target = Math.atan2(player.vy, speed) * 0.9;
      player.rot += (target - player.rot) * Math.min(1, dt * 18);
      if (Math.random() < 0.6) particles.push({ x: player.x - 2, y: player.y + CUBE * 0.7, vx: -speed * 0.5 - Math.random() * 80, vy: (Math.random() - 0.5) * 60, life: 0.4, size: 3 + Math.random() * 4, g: 0, glow: true, color: ['#ffd23f', '#ff9a1f', '#fff3b0'][Math.floor(Math.random() * 3)] });
    } else if (player.ball) {
      player.rot += player.grav * speed * dt / (CUBE / 2); // roll along whichever side it's stuck to
    } else if (player.onGround) {
      const target = Math.round(player.rot / (Math.PI / 2)) * (Math.PI / 2);
      player.rot += (target - player.rot) * Math.min(1, dt * 20);
    } else {
      player.rot += player.grav * dt * Math.PI / AIR_TIME; // half a turn per jump
      // sparkles while in the air
      if (Math.random() < 0.3) particles.push({ x: player.x + 6, y: player.y + CUBE / 2 + (Math.random() - 0.5) * 24, vx: -speed * 0.4, vy: (Math.random() - 0.5) * 40, life: 0.45, size: 2 + Math.random() * 3, g: 0, glow: true, color: '#ffcf4d' });
    }
  }

  // ---- Draw ----
  function hue() { return ((mode ? mode.hue : 200) + distance / 40) % 360; }
  const TAU = Math.PI * 2;
  const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }; // fixed "random" for scenery

  // height of a smooth hill line at screen x (a few sine waves; `scroll` moves the layer)
  function hillY(x, scroll, amp, seed) {
    const u = (x + scroll) / 160;
    return GROUND_Y - amp * (0.5 + 0.3 * Math.sin(u + seed) + 0.15 * Math.sin(u * 2.3 + seed * 2) + 0.05 * Math.sin(u * 5.1 + seed * 3));
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSky(h, beat) {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, `hsl(${h}, 70%, 8%)`);
    sky.addColorStop(0.6, `hsl(${(h + 25) % 360}, 65%, 20%)`);
    sky.addColorStop(1, `hsl(${(h + 50) % 360}, 75%, 36%)`);
    ctx.fillStyle = sky;
    ctx.fillRect(-20, -20, W + 40, GROUND_Y + 40);

    // twinkling stars (drift very slowly)
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 60; i++) {
      const span = W + 100;
      const x = ((rnd(i) * span - distance * 0.03) % span + span) % span - 50;
      const y = rnd(i + 99) * GROUND_Y * 0.7;
      const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(clock * (0.8 + rnd(i + 7) * 2) + i));
      ctx.globalAlpha = twinkle * (0.35 + 0.65 * rnd(i + 3)) * (1 - y / (GROUND_Y * 0.8));
      const sz = rnd(i + 5) < 0.15 ? 2.5 : 1.5;
      ctx.fillRect(x, y, sz, sz);
    }
    ctx.globalAlpha = 1;

    // big striped retro sun with a glow that pulses on the beat
    const sx = W * 0.68, sy = GROUND_Y * 0.62, sr = Math.min(W, GROUND_Y) * 0.2 * (1 + 0.035 * beat);
    const halo = ctx.createRadialGradient(sx, sy, sr * 0.8, sx, sy, sr * 2.4);
    halo.addColorStop(0, `hsla(${(h + 60) % 360}, 100%, 60%, ${0.3 + 0.25 * beat})`);
    halo.addColorStop(1, `hsla(${(h + 60) % 360}, 100%, 60%, 0)`);
    ctx.fillStyle = halo;
    ctx.fillRect(sx - sr * 2.5, sy - sr * 2.5, sr * 5, sr * 5);
    const sun = ctx.createLinearGradient(0, sy - sr, 0, sy + sr);
    sun.addColorStop(0, `hsl(${(h + 70) % 360}, 100%, 72%)`);
    sun.addColorStop(1, `hsl(${(h + 20) % 360}, 100%, 55%)`);
    ctx.save();
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.clip();
    ctx.fillStyle = sun;
    ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    ctx.fillStyle = sky; // stripes painted in sky colour look like gaps
    for (let k = 0; k < 6; k++) {
      const yy = sy + ((k + (clock * 0.25) % 1) / 6) * sr;
      ctx.fillRect(sx - sr, yy, sr * 2, 1.5 + k * 1.3);
    }
    ctx.restore();

    // two layers of hills: the farther one moves slower
    const layers = [
      { par: 0.08, amp: GROUND_Y * 0.42, seed: 1, col: `hsl(${(h + 30) % 360}, 45%, 20%)` },
      { par: 0.18, amp: GROUND_Y * 0.26, seed: 4, col: `hsl(${(h + 15) % 360}, 50%, 12%)` },
    ];
    for (const L of layers) {
      ctx.beginPath();
      ctx.moveTo(-20, GROUND_Y);
      for (let x = -20; x <= W + 36; x += 16) ctx.lineTo(x, hillY(x, distance * L.par, L.amp, L.seed));
      ctx.lineTo(W + 40, GROUND_Y);
      ctx.closePath();
      ctx.fillStyle = L.col;
      ctx.fill();
    }

    // slowly spinning outline squares in the middle distance
    ctx.lineWidth = 2;
    ctx.strokeStyle = `hsla(${(h + 160) % 360}, 100%, 70%, ${0.12 + 0.12 * beat})`;
    for (let i = 0; i < 10; i++) {
      const span = W + 200;
      const x = ((i * 173 - distance * 0.35) % span + span) % span - 100;
      const y = (0.12 + rnd(i + 40) * 0.55) * GROUND_Y;
      const sz = 16 + rnd(i + 50) * 30;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(clock * (0.2 + rnd(i) * 0.4) + i);
      ctx.strokeRect(-sz / 2, -sz / 2, sz, sz);
      ctx.restore();
    }
  }

  function drawGround(h, accent, beat) {
    const gh = H - GROUND_Y;
    const gg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    gg.addColorStop(0, `hsl(${h}, 55%, 15%)`);
    gg.addColorStop(1, `hsl(${h}, 60%, 4%)`);
    ctx.fillStyle = gg;
    ctx.fillRect(-20, GROUND_Y, W + 40, gh + 20);

    // perspective grid: lines fan out toward the viewer and scroll with the world
    ctx.strokeStyle = `hsla(${(h + 160) % 360}, 100%, 65%, 0.16)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const vx = W / 2;
    for (let x = -groundOffset - 400; x < W + 400; x += 40) { ctx.moveTo(x, GROUND_Y); ctx.lineTo(vx + (x - vx) * 3, H + 20); }
    const phase = (distance / 40) % 1;
    for (let k = 1; k <= 8; k++) { const f = (k - phase) / 8, y = GROUND_Y + gh * f * f; ctx.moveTo(-20, y); ctx.lineTo(W + 20, y); }
    ctx.stroke();

    // glowing edge where the floor starts
    const glow = ctx.createLinearGradient(0, GROUND_Y - 14, 0, GROUND_Y + 22);
    glow.addColorStop(0, 'rgba(0,0,0,0)');
    glow.addColorStop(0.4, accent.replace('hsl', 'hsla').replace(')', `, ${0.25 + 0.3 * beat})`));
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(-20, GROUND_Y - 14, W + 40, 36);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-20, GROUND_Y - 1, W + 40, 2.5);
  }

  function drawBlock(o, h, accent) {
    const g = ctx.createLinearGradient(0, o.y, 0, o.y + o.h);
    g.addColorStop(0, `hsl(${h}, 45%, 27%)`);
    g.addColorStop(1, `hsl(${h}, 50%, 10%)`);
    ctx.fillStyle = g;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    // an inset panel per cube-height
    ctx.strokeStyle = 'rgba(255,255,255,0.09)';
    ctx.lineWidth = 2;
    for (let yy = o.y; yy < o.y + o.h - 1; yy += 40) ctx.strokeRect(o.x + 9, yy + 9, o.w - 18, 22);
    // glowing outline (a wide faint stroke under a thin bright one)
    ctx.strokeStyle = accent;
    ctx.globalAlpha = 0.25; ctx.lineWidth = 6;
    ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
    ctx.globalAlpha = 1; ctx.lineWidth = 2;
    ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
    // shine along the top
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(o.x + 3, o.y + 3, o.w - 6, 2);
  }

  // floating slab: dark navy-to-black panel with a crisp white outline (neighbouring slabs join up)
  function drawSlab(o) {
    const g = ctx.createLinearGradient(0, o.y, 0, o.y + o.h);
    g.addColorStop(0, '#000');
    g.addColorStop(1, '#0d2a6b');
    ctx.fillStyle = g;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    const left = !obstacles.some(n => n.slab && n.y === o.y && Math.abs(n.x + n.w - o.x) < 1);
    const right = !obstacles.some(n => n.slab && n.y === o.y && Math.abs(n.x - (o.x + o.w)) < 1);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(o.x, o.y + 1); ctx.lineTo(o.x + o.w, o.y + 1);
    ctx.moveTo(o.x, o.y + o.h - 1); ctx.lineTo(o.x + o.w, o.y + o.h - 1);
    if (left) { ctx.moveTo(o.x + 1, o.y); ctx.lineTo(o.x + 1, o.y + o.h); }
    if (right) { ctx.moveTo(o.x + o.w - 1, o.y); ctx.lineTo(o.x + o.w - 1, o.y + o.h); }
    ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  }

  function drawSpike(o, h) {
    if (o.flip) { // ceiling spike: draw it upside down around its middle
      ctx.save(); ctx.translate(0, 2 * o.y + o.h); ctx.scale(1, -1);
      drawSpike({ ...o, flip: false }, h);
      ctx.restore();
      return;
    }
    const g = ctx.createLinearGradient(0, o.y, 0, o.y + o.h);
    g.addColorStop(0, `hsl(${h}, 30%, 82%)`);
    g.addColorStop(0.35, `hsl(${h}, 35%, 35%)`);
    g.addColorStop(1, `hsl(${h}, 45%, 8%)`);
    ctx.beginPath();
    ctx.moveTo(o.x + 1, o.y + o.h); ctx.lineTo(o.x + o.w / 2, o.y); ctx.lineTo(o.x + o.w - 1, o.y + o.h);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 5; ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.stroke();
    // a shine on the left face
    ctx.beginPath();
    ctx.moveTo(o.x + o.w / 2, o.y + 6); ctx.lineTo(o.x + 10, o.y + o.h - 3); ctx.lineTo(o.x + o.w / 2 - 2, o.y + o.h - 3);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.fill();
  }

  // the ceiling over a ship section: a dark slab reaching up off the top of the screen
  function drawCeiling(o, h, accent) {
    const bottom = o.y + o.h;
    const g = ctx.createLinearGradient(0, bottom - 120, 0, bottom);
    g.addColorStop(0, `hsl(${h}, 50%, 6%)`);
    g.addColorStop(1, `hsl(${h}, 45%, 18%)`);
    ctx.fillStyle = g;
    ctx.fillRect(o.x, -20, o.w, bottom + 20);
    ctx.strokeStyle = accent; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.3; ctx.fillStyle = accent; ctx.fillRect(o.x, bottom - 6, o.w, 6); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(o.x, bottom); ctx.lineTo(o.x + o.w, bottom); ctx.stroke();
  }

  // ground spikes: a black strip of jagged little spikes with a white outline
  function drawThorns(o) {
    const x0 = Math.max(o.x, -20), x1 = Math.min(o.x + o.w, W + 20), base = o.y + o.h;
    if (x1 <= x0) return;
    const STEP = 7, k0 = Math.floor((x0 - o.x) / STEP), k1 = Math.ceil((x1 - o.x) / STEP);
    const peak = k => { const r = Math.sin((k + 1) * 12.9898) * 43758.5453; return 6 + (r - Math.floor(r)) * (o.h - 6); };
    ctx.beginPath();
    ctx.moveTo(o.x + k0 * STEP, base);
    for (let k = k0; k <= k1; k++) {
      const x = Math.min(o.x + o.w, o.x + k * STEP);
      ctx.lineTo(x, base - (k % 2 ? peak(k) : peak(k) * 0.35));
    }
    ctx.lineTo(Math.min(o.x + o.w, o.x + k1 * STEP), base);
    ctx.closePath();
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.lineJoin = 'miter';
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.stroke();
  }

  function drawFinish(accent) {
    const glow = ctx.createLinearGradient(finishX - 40, 0, finishX + 80, 0);
    glow.addColorStop(0, 'rgba(255,255,255,0)');
    glow.addColorStop(0.5, 'rgba(255,255,255,0.25)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(finishX - 40, 0, 120, GROUND_Y);
    for (let y = GROUND_Y - 20, row = 0; y > -20; y -= 20, row++) {
      for (let c = 0; c < 2; c++) {
        ctx.fillStyle = (row + c) % 2 ? '#fff' : '#111';
        ctx.fillRect(finishX + c * 20, y, 20, 20);
      }
    }
    ctx.strokeStyle = accent; ctx.lineWidth = 2;
    ctx.strokeRect(finishX, -2, 40, GROUND_Y + 2);
  }

  function drawCube() {
    const cx = player.x + CUBE / 2;
    if (player.wave) return drawWave();
    if (player.ufo) return drawUfo();
    if (player.spider) return drawSpider();
    if (player.swing) return drawSwing();
    // ghost trail
    player.trail.forEach((g, i) => {
      const a = (i + 1) / (player.trail.length + 1), sz = CUBE * (0.55 + 0.45 * a);
      ctx.save();
      ctx.translate(g.x + CUBE / 2, g.y + CUBE / 2);
      ctx.rotate(g.rot);
      ctx.globalAlpha = a * 0.22;
      ctx.fillStyle = player.ball ? '#ff7a3c' : '#ffb02e';
      if (player.ball) { ctx.beginPath(); ctx.arc(0, 0, sz / 2, 0, TAU); ctx.fill(); }
      else ctx.fillRect(-sz / 2, -sz / 2, sz, sz);
      ctx.restore();
    });
    ctx.globalAlpha = 1;

    // soft shadow on whatever is underneath (shrinks as the cube rises)
    if (player.grav < 0) return player.ship ? drawShip() : player.ball ? drawBall() : drawCubeBody(); // no floor shadow upside down
    let surface = GROUND_Y;
    for (const o of obstacles) if (o.t === 'b' && o.x < player.x + CUBE && o.x + o.w > player.x && o.y >= player.y + CUBE - 2) surface = Math.min(surface, o.y);
    const near = Math.max(0.2, 1 - Math.max(0, surface - (player.y + CUBE)) / 150);
    ctx.fillStyle = `rgba(0,0,0,${0.35 * near})`;
    ctx.beginPath();
    ctx.ellipse(cx, surface + 2, CUBE * 0.6 * near, 5 * near, 0, 0, TAU);
    ctx.fill();

    if (player.ship) return drawShip();
    if (player.ball) return drawBall();
    drawCubeBody();
  }

  function drawCubeBody() {
    // the cube: squash & stretch around the side it stands on (visual only — the hitbox doesn't change)
    const cx = player.x + CUBE / 2, g = player.grav;
    const sq = player.squash;
    ctx.save();
    ctx.translate(cx, g > 0 ? player.y + CUBE : player.y);
    ctx.scale(1 + 0.18 * sq, 1 - 0.18 * sq);
    ctx.translate(0, -g * CUBE / 2);
    ctx.rotate(player.rot);
    const half = CUBE / 2;
    ctx.shadowColor = 'rgba(255,190,60,0.8)';
    ctx.shadowBlur = 18;
    const body = ctx.createLinearGradient(-half, -half, half, half);
    body.addColorStop(0, '#ffe56e');
    body.addColorStop(1, '#ff961c');
    ctx.fillStyle = body;
    rrect(-half, -half, CUBE, CUBE, 5); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#5a3500'; ctx.lineWidth = 3;
    rrect(-half + 1.5, -half + 1.5, CUBE - 3, CUBE - 3, 4); ctx.stroke();
    // bevel highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-half + 5, half - 9); ctx.lineTo(-half + 5, -half + 5); ctx.lineTo(half - 9, -half + 5); ctx.stroke();
    // face
    ctx.fillStyle = '#2b1a00';
    rrect(-11, -9, 8, 9, 2); ctx.fill();
    rrect(4, -9, 8, 9, 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-7, -8, 3, 3); ctx.fillRect(8, -8, 3, 3);
    ctx.fillStyle = '#2b1a00';
    rrect(-7, 5, 15, 4, 2); ctx.fill();
    ctx.restore();
  }

  // the ship: a small copy of the cube riding a winged hull (the hitbox is still the 40x40 box)
  function drawShip() {
    ctx.save();
    ctx.translate(player.x + CUBE / 2, player.y + CUBE / 2);
    ctx.rotate(player.rot);
    ctx.shadowColor = 'rgba(255,190,60,0.8)'; ctx.shadowBlur = 16;
    // pilot cube
    const body = ctx.createLinearGradient(-10, -20, 10, 0);
    body.addColorStop(0, '#ffe56e'); body.addColorStop(1, '#ff961c');
    ctx.fillStyle = body;
    rrect(-9, -19, 20, 20, 3); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#5a3500'; ctx.lineWidth = 2;
    rrect(-8, -18, 18, 18, 3); ctx.stroke();
    ctx.fillStyle = '#2b1a00';
    ctx.fillRect(-4, -13, 3, 4); ctx.fillRect(4, -13, 3, 4); ctx.fillRect(-3, -6, 9, 2);
    // hull
    const hull = ctx.createLinearGradient(0, -2, 0, 16);
    hull.addColorStop(0, '#4dc3ff'); hull.addColorStop(1, '#1a4f8a');
    ctx.fillStyle = hull;
    ctx.beginPath();
    ctx.moveTo(-22, -2); ctx.lineTo(16, -2); ctx.lineTo(24, 6); ctx.lineTo(14, 16); ctx.lineTo(-18, 16); ctx.lineTo(-22, 8);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#0b2440'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-18, 2); ctx.lineTo(15, 2); ctx.stroke();
    // wing fin
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.moveTo(-20, -2); ctx.lineTo(-24, -12); ctx.lineTo(-12, -2); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // the ball: a spinning sphere with a ring of studs and the cube's face (hitbox is still the 40x40 box)
  function drawBall() {
    const r = CUBE / 2;
    ctx.save();
    ctx.translate(player.x + r, player.y + r);
    ctx.shadowColor = 'rgba(255,92,92,0.8)'; ctx.shadowBlur = 18;
    const body = ctx.createRadialGradient(-6, -6, 3, 0, 0, r);
    body.addColorStop(0, '#ffe56e'); body.addColorStop(0.6, '#ff961c'); body.addColorStop(1, '#d4471a');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(0, 0, r - 1, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#5a1f00'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r - 2.5, 0, TAU); ctx.stroke();
    ctx.rotate(player.rot);
    // spokes and studs spin with the roll
    ctx.strokeStyle = 'rgba(90,31,0,0.55)'; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * 10, Math.sin(a) * 10); ctx.lineTo(Math.cos(a) * (r - 3), Math.sin(a) * (r - 3)); ctx.stroke();
      ctx.fillStyle = '#fff3b0';
      ctx.beginPath(); ctx.arc(Math.cos(a + Math.PI / 4) * (r - 7), Math.sin(a + Math.PI / 4) * (r - 7), 2.5, 0, TAU); ctx.fill();
    }
    // face (turns with the ball)
    ctx.fillStyle = '#2b1a00';
    ctx.fillRect(-6, -5, 4, 5); ctx.fillRect(3, -5, 4, 5); ctx.fillRect(-4, 4, 9, 2.5);
    ctx.restore();
  }

  // the UFO: a little saucer with the cube riding in a glass dome
  function drawUfo() {
    ctx.save();
    ctx.translate(player.x + CUBE / 2, player.y + CUBE / 2);
    if (player.grav < 0) ctx.scale(1, -1);
    // dome + pilot
    ctx.fillStyle = 'rgba(190,240,255,0.35)';
    ctx.beginPath(); ctx.arc(0, 0, 13, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#ffb02e'; ctx.fillRect(-6, -10, 12, 11);
    ctx.fillStyle = '#2b1a00'; ctx.fillRect(-4, -7, 3, 3); ctx.fillRect(2, -7, 3, 3);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, 13, Math.PI, 0); ctx.stroke();
    // saucer
    ctx.shadowColor = 'rgba(201,163,255,0.9)'; ctx.shadowBlur = 14;
    const g = ctx.createLinearGradient(0, 0, 0, 14);
    g.addColorStop(0, '#e6d6ff'); g.addColorStop(1, '#6a3fc4');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 6, 20, 8, 0, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#2a1458'; ctx.lineWidth = 2; ctx.stroke();
    // lights
    for (let i = -2; i <= 2; i++) {
      ctx.fillStyle = (Math.floor(clock * 8) + i) % 2 ? '#ffd23f' : '#fff3b0';
      ctx.beginPath(); ctx.arc(i * 7, 7, 2, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // the spider: a round-shouldered body with the cube's face and four scuttling legs a side
  function drawSpider() {
    ctx.save();
    ctx.translate(player.x + CUBE / 2, player.y + CUBE / 2);
    if (player.grav < 0) ctx.scale(1, -1);
    const step = Math.sin(clock * 30) * 3;
    ctx.strokeStyle = '#3a0d36'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 0; i < 4; i++) {
      const sx = -9 + i * 6, k = (i % 2 ? step : -step);
      ctx.beginPath(); ctx.moveTo(sx, 4); ctx.lineTo(sx - 8 + k, 10); ctx.lineTo(sx - 10 + k, 20); ctx.stroke();
    }
    ctx.shadowColor = 'rgba(255,61,240,0.8)'; ctx.shadowBlur = 14;
    const g = ctx.createLinearGradient(0, -14, 0, 8);
    g.addColorStop(0, '#ffe56e'); g.addColorStop(1, '#ff961c');
    ctx.fillStyle = g;
    rrect(-14, -14, 28, 22, 9); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#5a3500'; ctx.lineWidth = 2.5; rrect(-14, -14, 28, 22, 9); ctx.stroke();
    ctx.fillStyle = '#ff3df0'; ctx.fillRect(-14, 2, 28, 4);
    ctx.fillStyle = '#2b1a00';
    ctx.fillRect(-7, -8, 4, 5); ctx.fillRect(4, -8, 4, 5);
    ctx.restore();
  }

  // the swing: a rounded pod with fins top and bottom; the flame shows which way it's pulled
  function drawSwing() {
    ctx.save();
    ctx.translate(player.x + CUBE / 2, player.y + CUBE / 2);
    ctx.rotate(player.rot);
    const d = player.grav; // flame on the side it's being pulled away from
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.moveTo(-6, -d * 13); ctx.lineTo(0, -d * (22 + Math.random() * 6)); ctx.lineTo(6, -d * 13); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffa53c';
    ctx.beginPath(); ctx.moveTo(-16, -6); ctx.lineTo(-20, -16); ctx.lineTo(-8, -10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-16, 6); ctx.lineTo(-20, 16); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill();
    ctx.shadowColor = 'rgba(255,165,60,0.9)'; ctx.shadowBlur = 14;
    const g = ctx.createLinearGradient(-14, -12, 14, 12);
    g.addColorStop(0, '#ffe56e'); g.addColorStop(1, '#ff961c');
    ctx.fillStyle = g;
    rrect(-15, -12, 30, 24, 10); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#5a3500'; ctx.lineWidth = 2.5; rrect(-15, -12, 30, 24, 10); ctx.stroke();
    ctx.fillStyle = 'rgba(190,240,255,0.7)'; rrect(2, -7, 9, 9, 3); ctx.fill();
    ctx.fillStyle = '#2b1a00'; ctx.fillRect(-7, -5, 4, 5); ctx.fillRect(-1, -5, 4, 5);
    ctx.restore();
  }

  // the wave: a sharp dart pointing where it's going, drawing a glowing zigzag trail behind it
  function drawWave() {
    const t = player.waveTrail;
    if (t.length > 1) {
      ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(t[0].x, t[0].y);
      for (const p of t) ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = 'rgba(77,195,255,0.35)'; ctx.lineWidth = 12; ctx.stroke();
      ctx.strokeStyle = '#bff0ff'; ctx.lineWidth = 4; ctx.stroke();
    }
    ctx.save();
    ctx.translate(player.x + CUBE / 2, player.y + CUBE / 2);
    ctx.rotate(player.rot);
    ctx.shadowColor = 'rgba(255,190,60,0.9)'; ctx.shadowBlur = 16;
    const body = ctx.createLinearGradient(-12, -10, 14, 10);
    body.addColorStop(0, '#ffe56e'); body.addColorStop(1, '#ff961c');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-12, -12); ctx.lineTo(-6, 0); ctx.lineTo(-12, 12); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#5a3500'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.fillStyle = '#2b1a00'; ctx.fillRect(1, -3, 4, 4);
    ctx.restore();
  }

  // a wave tunnel piece: a dark (possibly sloped) slab of floor or ceiling, lined with jagged spikes
  function drawTerrain(o) {
    const floor = o.t === 'tf', base = floor ? GROUND_Y : GROUND_Y - CORRIDOR;
    const sy = x => floor ? GROUND_Y - (o.h0 + (o.h1 - o.h0) * (x - o.x) / o.w) : GROUND_Y - CORRIDOR + (o.h0 + (o.h1 - o.h0) * (x - o.x) / o.w);
    const y0 = sy(o.x), y1 = sy(o.x + o.w);
    if (o.h0 || o.h1) {
      const g = ctx.createLinearGradient(0, floor ? Math.min(y0, y1) : base, 0, floor ? base : Math.max(y0, y1));
      g.addColorStop(floor ? 0 : 1, '#000'); g.addColorStop(floor ? 1 : 0, '#0d2a6b');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(o.x, base); ctx.lineTo(o.x, y0); ctx.lineTo(o.x + o.w, y1); ctx.lineTo(o.x + o.w, base); ctx.closePath(); ctx.fill();
    }
    if (o.safe) return;
    // spikes along the surface (pointing away from it), then a white outline
    const STEP = 6.66, dir = floor ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(o.x, y0);
    for (let k = 1; k <= 6; k++) {
      const x = o.x + k * STEP, r = Math.sin((o.x + k) * 12.9898) * 43758.5453, hgt = 7 + (r - Math.floor(r)) * 9;
      ctx.lineTo(x - STEP / 2, sy(x - STEP / 2) + dir * (k % 2 ? hgt : hgt * 0.6));
      ctx.lineTo(x, sy(x));
    }
    ctx.closePath();
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.lineJoin = 'miter';
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // a glowing oval gate with chevrons (← for half speed, → ×N for faster) and its label
  // gravity portal: a glowing ring with a row of black blocky teeth down its right side,
  // and an arrow showing which way gravity will point (yellow = up, blue = down)
  function drawGravityPortal(o, st) {
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2, rx = 15, ry = o.h / 2 - 2;
    const pulse = 0.5 + 0.5 * Math.sin(clock * 6 + o.x * 0.01);
    ctx.save();
    ctx.globalAlpha = o.used ? 0.35 : 1;
    // teeth: blocks sticking out of the back of the ring, longest in the middle
    ctx.fillStyle = '#000';
    const N = 13;
    for (let i = 0; i < N; i++) {
      const a = -Math.PI / 2 + (i + 0.5) / N * Math.PI;          // right half of the ellipse, top to bottom
      const px = cx + Math.cos(a) * rx, py = cy + Math.sin(a) * ry;
      const len = 8 + 9 * Math.cos(a) + (i % 2) * 3;
      ctx.fillRect(px - 2, py - 4.5, len + 2, 9);
    }
    // inner glow
    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, ry);
    g.addColorStop(0, st.color + '50'); g.addColorStop(1, st.color + '08');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.fill();
    // the ring
    ctx.shadowColor = st.color; ctx.shadowBlur = 14 + 8 * pulse;
    ctx.strokeStyle = st.color; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(cx - 1, cy, rx - 3, ry - 3, 0, 0, TAU); ctx.stroke();
    // arrow
    const d = st.grav; // -1 points up, 1 points down
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 14 * d); ctx.lineTo(cx, cy + 14 * d);
    ctx.moveTo(cx - 6, cy + 7 * d); ctx.lineTo(cx, cy + 14 * d); ctx.lineTo(cx + 6, cy + 7 * d);
    ctx.stroke();
    ctx.restore();
  }

  function drawPortal(o) {
    const st = PORTAL_STYLE[o.tier], cx = o.x + o.w / 2, cy = o.y + o.h / 2, rx = 17, ry = o.h / 2;
    if (st.grav) return drawGravityPortal(o, st);
    const pulse = 0.5 + 0.5 * Math.sin(clock * 6 + o.x * 0.01);
    ctx.save();
    ctx.globalAlpha = o.used ? 0.35 : 1;
    // inner swirl
    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, ry);
    g.addColorStop(0, 'rgba(255,255,255,0.55)');
    g.addColorStop(0.5, st.color + '55');
    g.addColorStop(1, st.color + '10');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.fill();
    // glowing frame
    ctx.shadowColor = st.color; ctx.shadowBlur = 12 + 8 * pulse;
    ctx.strokeStyle = st.color; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx - 4, ry - 4, 0, 0, TAU); ctx.stroke();
    // chevrons
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const n = st.arrows, gap = 13, top = cy - ((n - 1) * gap) / 2;
    for (let i = 0; i < n; i++) {
      const y = top + i * gap, d = st.back ? -5 : 5;
      ctx.beginPath(); ctx.moveTo(cx - d, y - 5); ctx.lineTo(cx + d, y); ctx.lineTo(cx - d, y + 5); ctx.stroke();
    }
    // ship / cube portals show a little icon of what you turn into
    if (!n) {
      ctx.fillStyle = '#fff';
      if (st.ship) {
        ctx.beginPath(); ctx.moveTo(cx - 9, cy + 2); ctx.lineTo(cx + 7, cy + 2); ctx.lineTo(cx + 11, cy + 6); ctx.lineTo(cx + 6, cy + 10); ctx.lineTo(cx - 8, cy + 10); ctx.closePath(); ctx.fill();
        ctx.fillRect(cx - 4, cy - 6, 8, 8);
      } else if (st.ball) { ctx.beginPath(); ctx.arc(cx, cy, 8, 0, TAU); ctx.fill(); }
      else if (st.ufo) { ctx.beginPath(); ctx.ellipse(cx, cy + 3, 10, 4, 0, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(cx, cy + 1, 5, Math.PI, 0); ctx.fill(); }
      else if (st.spider) { ctx.fillRect(cx - 6, cy - 5, 12, 8); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); for (const sx of [-5, 0, 5]) { ctx.moveTo(cx + sx, cy + 3); ctx.lineTo(cx + sx - 4, cy + 10); } ctx.stroke(); }
      else if (st.swing) { ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx + 8, cy); ctx.lineTo(cx, cy + 10); ctx.lineTo(cx - 8, cy); ctx.closePath(); ctx.fill(); }
      else if (st.wave) { ctx.beginPath(); ctx.moveTo(cx + 9, cy); ctx.lineTo(cx - 7, cy - 8); ctx.lineTo(cx - 3, cy); ctx.lineTo(cx - 7, cy + 8); ctx.closePath(); ctx.fill(); }
      else ctx.fillRect(cx - 7, cy - 7, 14, 14);
    }
    // label above
    ctx.font = '800 16px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(st.label, cx, o.y - 8);
    ctx.fillStyle = st.color;
    ctx.fillText(st.label, cx, o.y - 8);
    ctx.restore();
  }

  // green diamonds where practice checkpoints were placed (the newest one is brighter)
  function drawCheckpoints() {
    checkpoints.forEach((cp, i) => {
      const x = player.x + CUBE / 2 - (distance - cp.dist), y = cp.y + CUBE / 2;
      if (x < -30 || x > W + 30) return;
      const newest = i === checkpoints.length - 1;
      ctx.globalAlpha = newest ? 1 : 0.45;
      ctx.strokeStyle = 'rgba(77,255,136,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.lineTo(x, GROUND_Y); ctx.stroke();
      ctx.save();
      ctx.translate(x, y); ctx.rotate(Math.PI / 4);
      ctx.shadowColor = '#4dff88'; ctx.shadowBlur = newest ? 14 : 0;
      ctx.fillStyle = '#4dff88'; ctx.fillRect(-8, -8, 16, 16);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(-8, -8, 16, 16);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  function draw() {
    // map game units to screen pixels (sharp on retina screens)
    ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    const h = hue(), beat = music.beat();
    const accent = `hsl(${(h + 160) % 360}, 100%, 65%)`;
    drawSky(h, beat);
    drawGround(h, accent, beat);
    if (mode && finishX < W + 80) drawFinish(accent);

    for (const o of obstacles) { // ceilings and ground spikes go underneath everything else
      if (o.x > W + 60 || o.x + o.w < -60) continue;
      if (o.t === 'c') drawCeiling(o, h, accent); else if (o.t === 'g') drawThorns(o); else if (o.t === 'tf' || o.t === 'tc') drawTerrain(o);
    }
    for (const o of obstacles) {
      if (o.x > W + 60 || o.x + o.w < -60 || o.t === 'c' || o.t === 'g' || o.t === 'tf' || o.t === 'tc') continue; // off screen / drawn above
      if (o.t === 'b' && o.slab) drawSlab(o);
      else if (o.t === 'b') drawBlock(o, h, accent); else if (o.t === 's') drawSpike(o, h); else if (o.t === 'c') drawCeiling(o, h, accent); else drawPortal(o);
    }

    // particles (glowing ones are added on top of what's below)
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.globalCompositeOperation = p.glow ? 'lighter' : 'source-over';
      ctx.fillStyle = p.color || '#ffd23f';
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalCompositeOperation = 'source-over';
    // shockwave rings
    for (const r of rings) {
      ctx.globalAlpha = Math.max(0, r.life);
      ctx.strokeStyle = `rgb(${r.color})`;
      ctx.lineWidth = 3 + 6 * r.life;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (inPractice) drawCheckpoints();
    if (state !== 'dead' && state !== 'respawn') drawCube();
    if (showHitboxes) drawHitboxes();

    ctx.restore();

    // vignette: darken the edges a little
    const vg = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // dim the game behind the pause / crash screens (their text and buttons are HTML)
    if (state === 'paused' || state === 'dead' || state === 'complete') {
      ctx.fillStyle = state === 'complete' ? 'rgba(0,0,0,0.25)' : 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, W, H);
    }

    // big "2x SPEED" message when you go through a portal
    if (speedFlash && state !== 'menu' && state !== 'title') {
      const a = Math.min(1, speedFlash.life * 1.5), grow = 1 + (1 - speedFlash.life) * 0.25;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(W / 2, GROUND_Y * 0.32);
      ctx.scale(grow, grow);
      ctx.font = '900 44px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center';
      const fit = Math.min(1, (W - 48) / (ctx.measureText(speedFlash.text).width * grow)); // shrink long messages on narrow screens
      ctx.scale(fit, fit);
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.strokeText(speedFlash.text, 0, 0);
      ctx.shadowColor = speedFlash.color; ctx.shadowBlur = 16;
      ctx.fillStyle = speedFlash.color;
      ctx.fillText(speedFlash.text, 0, 0);
      ctx.restore();
    }

    // HUD during a run: progress bar + % for levels, score for Endless
    if (state !== 'menu' && state !== 'title') {
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 6;
      ctx.fillStyle = '#fff';
      ctx.font = '800 30px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(mode ? progress() + '%' : Math.floor(distance / 10), 24, 46);
      ctx.font = '600 14px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillText(inPractice ? `PRACTICE · ATTEMPT ${attempt} · ◆ ${checkpoints.length}`
        : mode ? `${mode.name.toUpperCase()} · BEST ${levelBest(mode)}%` : 'BEST ' + best, 24, 68);
      ctx.shadowBlur = 0;
      if (mode) {
        // centred at the top; drops below the top-right buttons when the screen is narrow
        const bw = Math.min(320, W * 0.35), bx = (W - bw) / 2, fill = bw * progress() / 100;
        const buttonsLeft = (window.innerWidth - $('controls').offsetWidth - 20) / viewScale;
        const by = bx + bw < buttonsLeft ? 30 : Math.max(62 / viewScale, 84); // below the buttons and the text
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        rrect(bx, by, bw, 12, 6); ctx.fill();
        if (fill > 0) {
          const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
          pg.addColorStop(0, '#4dc3ff'); pg.addColorStop(1, '#4dff88');
          ctx.fillStyle = pg;
          rrect(bx, by, Math.max(12, fill), 12, 6); ctx.fill();
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
        rrect(bx, by, bw, 12, 6); ctx.stroke();
      }
    }
  }

  // ---- Debug: hitbox overlay (mirrors the collision code in update) ----
  function drawHitboxes() {
    ctx.lineWidth = 2;
    for (const o of obstacles) {
      if (o.t === 'b') {
        // full block rectangle (solid for the outer box, deadly for the inner box)
        ctx.strokeStyle = '#ff4d4d';
        ctx.fillStyle = 'rgba(255,77,77,0.15)';
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeRect(o.x, o.y, o.w, o.h);
        // landing zone: outer box bottom anywhere in here while falling = snap up and land
        // (a ship can also slide along the underside of a block)
        ctx.fillStyle = 'rgba(77,255,136,0.45)';
        if (o.hang) ctx.fillRect(o.x, o.y + o.h - INNER, o.w, INNER); else ctx.fillRect(o.x, o.y, o.w, INNER);
      } else if (o.t === 's' || o.t === 'g') {
        const b = o.t === 's' ? spikeBox(o) : thornBox(o);
        ctx.fillStyle = 'rgba(255,77,77,0.45)';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#ff4d4d';
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      }
    }
    // wave tunnel: the deadly band along each spiked surface
    ctx.fillStyle = 'rgba(255,77,77,0.35)';
    for (const o of obstacles) {
      if ((o.t !== 'tf' && o.t !== 'tc') || (o.safe && !o.h0 && !o.h1)) continue;
      const f = o.t === 'tf', y = h => f ? GROUND_Y - h : GROUND_Y - CORRIDOR + h, d = f ? -SLOPE_SPIKE_HB : SLOPE_SPIKE_HB;
      ctx.beginPath(); ctx.moveTo(o.x, y(o.h0)); ctx.lineTo(o.x + o.w, y(o.h1)); ctx.lineTo(o.x + o.w, y(o.h1) + d); ctx.lineTo(o.x, y(o.h0) + d); ctx.closePath(); ctx.fill();
    }
    // the box ground spikes check (orange dashes) when it differs from the outer box
    if (player.wave) { const sb = spikeTouchBox(); ctx.setLineDash([4, 3]); ctx.strokeStyle = '#ffa53c'; ctx.strokeRect(sb.x, sb.y, sb.w, sb.h); ctx.setLineDash([]); }
    // cube: outer box (blue outline) and inner box (filled)
    const ob = outerBox(), ib = innerBox();
    ctx.strokeStyle = '#4dc3ff';
    ctx.strokeRect(ob.x, ob.y, ob.w, ob.h);
    ctx.fillStyle = 'rgba(255,61,240,0.6)';
    ctx.fillRect(ib.x, ib.y, ib.w, ib.h);
    ctx.strokeStyle = '#ff3df0';
    ctx.strokeRect(ib.x, ib.y, ib.w, ib.h);
  }

  // ---- Loop ----
  // Physics always runs in fixed 1/120 s steps, whatever the screen's frame rate (30, 60, 120 Hz…),
  // so jumps feel the same on every device and the levels play exactly as they were tested.
  const STEP = 1 / 120;
  let last = performance.now(), acc = 0;
  function frame(now) {
    requestAnimationFrame(frame); // ask for the next frame first, so one bad frame can't stop the game
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    let steps = 0;
    while (acc >= STEP && steps < 12) { update(STEP); acc -= STEP; steps++; }
    if (steps === 12) acc = 0; // way behind (e.g. tab was asleep): don't try to catch up
    syncUI();
    draw();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
